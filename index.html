<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7a3b6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>گوی نیایش</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(10px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom));
      background:
        radial-gradient(90% 55% at 50% 0%, #fff0f4 0%, #f7c5d3 34%, #eea3ba 70%, #e089a4 100%);
      color: #7a2340;
      font-family: Tahoma, "Segoe UI", sans-serif;
    }
    #love {
      margin: 0 14px 8px;
      max-width: 96vw;
      text-align: center;
      font-size: clamp(17px, 4.8vw, 30px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    }
    #stage {
      width: min(100vw, calc((100dvh - 108px) * 819 / 1024));
      aspect-ratio: 819 / 1024;
      position: relative;
      flex: 0 1 auto;
      filter: drop-shadow(0 18px 28px rgba(120, 40, 70, 0.18));
    }
    #photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
      border-radius: 18px;
    }
    #glass {
      position: absolute;
      left: 6.2%;
      top: 2.6%;
      width: 87.6%;
      height: 70.05%;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }
    #snow { position: absolute; inset: 0; width: 100%; height: 100%; }
    #rim {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow:
        inset 0 0 26px rgba(255, 236, 214, 0.2),
        inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }
  </style>
</head>
<body>
  <p id="love">نیایش قشنگم<br>خیلییییییییییییییییی دوست دارم نفسم</p>
  <div id="stage">
    <img id="photo" src="globe.jpg" alt="گوی برفی نیایش" width="819" height="1024">
    <div id="glass">
      <canvas id="snow"></canvas>
      <div id="rim"></div>
    </div>
  </div>
  <audio id="song" src="kalimba.wav" loop autoplay playsinline preload="auto"></audio>
  <script>
    const glass = document.getElementById("glass");
    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d", { alpha: true });
    const song = document.getElementById("song");
    song.volume = 0.8;

    function startSong() {
      const pending = song.play();
      if (pending && pending.catch) pending.catch(function () {});
    }
    startSong();
    window.addEventListener("pointerdown", startSong, true);
    window.addEventListener("touchstart", startSong, true);
    window.addEventListener("click", startSong, true);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) startSong();
    });

    const flakes = [];
    function resize() {
      const r = glass.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
    }
    function born(p) {
      p.x = (Math.random() * 1.5 - 0.75);
      p.y = -0.98 - Math.random() * 0.35;
      p.vy = 0.07 + Math.random() * 0.09;
      p.sway = Math.random() * Math.PI * 2;
      p.swaySpeed = 0.45 + Math.random() * 0.7;
      p.size = 0.7 + Math.random() * 1.8;
      p.a = 0.35 + Math.random() * 0.4;
      p.warm = Math.random() < 0.18;
    }
    function ensure() {
      const n = glass.getBoundingClientRect().width < 520 ? 48 : 72;
      while (flakes.length < n) {
        const p = {};
        born(p);
        p.y = -1 + Math.random() * 1.7;
        flakes.push(p);
      }
      flakes.length = n;
    }
    let last = performance.now();
    function draw(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const R = Math.min(w, h) / 2;
      ctx.clearRect(0, 0, w, h);
      for (const p of flakes) {
        p.sway += p.swaySpeed * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.sway) * 0.12 * dt;
        const rad = Math.hypot(p.x, p.y);
        if (p.y > 0.82 || rad > 0.95) born(p);
        const face = rad < 0.42 && p.y > -0.2 && p.y < 0.45;
        const size = (face ? p.size * 0.4 : p.size) * (R / 190);
        const alpha = face ? p.a * 0.35 : p.a;
        ctx.beginPath();
        ctx.fillStyle = p.warm
          ? "rgba(255, 220, 170, " + alpha + ")"
          : "rgba(255, 252, 248, " + alpha + ")";
        ctx.arc(cx + p.x * R * 0.92, cy + p.y * R * 0.92, size, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", function () { resize(); ensure(); });
    resize();
    ensure();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
