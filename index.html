<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140e0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>گوی نیایش</title>
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url("fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #140e0c; }
    body { font-family: Vazirmatn, Tahoma, sans-serif; }
    #wash {
      position: fixed;
      inset: -8%;
      background: url("globe.jpg") center/cover no-repeat;
      filter: blur(26px) brightness(0.62);
      transform: scale(1.08);
    }
    #photo, #glass, #love {
      position: absolute;
    }
    #photo {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      max-width: none;
    }
    #glass {
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }
    #snow { width: 100%; height: 100%; display: block; }
    #love {
      margin: 0;
      text-align: center;
      pointer-events: none;
      color: #f8e7c8;
      font-weight: 400;
      line-height: 1.35;
      text-shadow:
        0 1px 0 rgba(92, 48, 22, 0.45),
        0 2px 8px rgba(40, 16, 8, 0.55);
    }
    #love span { display: block; }
    #love .b { opacity: 0.95; }
  </style>
</head>
<body>
  <div id="wash"></div>
  <img id="photo" src="globe.jpg" alt="گوی برفی نیایش" width="819" height="1024">
  <div id="glass"><canvas id="snow"></canvas></div>
  <p id="love">
    <span class="a">نیایش قشنگم</span>
    <span class="b">خیلیی دوستت دارم</span>
  </p>
  <audio id="song" src="song.mp3" loop autoplay playsinline preload="auto"></audio>
  <script>
    const IW = 819, IH = 1024;
    const photo = document.getElementById("photo");
    const glass = document.getElementById("glass");
    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d", { alpha: true });
    const love = document.getElementById("love");
    const song = document.getElementById("song");
    song.volume = 0.85;
    function startSong() {
      const pending = song.play();
      if (pending && pending.catch) pending.catch(function () {});
    }
    startSong();
    window.addEventListener("pointerdown", startSong, true);
    window.addEventListener("touchstart", startSong, true);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) startSong();
    });

    function layout() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const scale = Math.min(sw / IW, sh / IH);
      const dw = IW * scale;
      const dh = IH * scale;
      const left = (sw - dw) / 2;
      const top = (sh - dh) / 2;
      photo.style.left = left + "px";
      photo.style.top = top + "px";
      photo.style.width = dw + "px";
      photo.style.height = dh + "px";

      const gx = left + dw * 0.07;
      const gy = top + dh * 0.024;
      const gw = dw * 0.86;
      const gh = dh * 0.688;
      glass.style.left = gx + "px";
      glass.style.top = gy + "px";
      glass.style.width = gw + "px";
      glass.style.height = gh + "px";

      love.style.left = (left + dw * 0.18) + "px";
      love.style.top = (top + dh * 0.805) + "px";
      love.style.width = (dw * 0.64) + "px";
      love.style.fontSize = Math.max(12, dw * 0.028) + "px";

      resizeSnow();
    }

    const flakes = [];
    function resizeSnow() {
      const r = glass.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
    }
    function born(p, anywhere) {
      if (anywhere) {
        const ang = Math.random() * Math.PI * 2;
        const rad = Math.sqrt(Math.random()) * 0.78;
        p.x = Math.cos(ang) * rad;
        p.y = Math.sin(ang) * rad;
      } else {
        const y = -0.86 - Math.random() * 0.05;
        const half = Math.sqrt(Math.max(0.04, 0.82 * 0.82 - y * y));
        p.x = (Math.random() * 2 - 1) * half;
        p.y = y;
      }
      p.vy = 0.028 + Math.random() * 0.03;
      p.sway = Math.random() * Math.PI * 2;
      p.swaySpeed = 0.45 + Math.random() * 0.55;
      p.drift = 0.1 + Math.random() * 0.16;
      p.size = 1.1 + Math.random() * 2.4;
      p.a = 0.55 + Math.random() * 0.35;
    }
    function ensure() {
      const n = window.innerWidth < 700 ? 90 : 130;
      while (flakes.length < n) {
        const p = {};
        born(p, true);
        flakes.push(p);
      }
    }
    let last = performance.now();
    function draw(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const w = canvas.width, h = canvas.height;
      const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2;
      ctx.clearRect(0, 0, w, h);
      for (const p of flakes) {
        p.sway += p.swaySpeed * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.sway) * p.drift * dt;
        const half = Math.sqrt(Math.max(0.02, 0.9 * 0.9 - p.y * p.y));
        if (p.x > half) p.x = half;
        if (p.x < -half) p.x = -half;
        if (p.y > 0.86) born(p, false);
        const onFace = Math.abs(p.x) < 0.74 && p.y > -0.58 && p.y < 0.4;
        if (onFace) continue;
        const size = p.size * (R / 260);
        ctx.beginPath();
        ctx.fillStyle = "rgba(255,255,255," + p.a + ")";
        ctx.shadowColor = "rgba(255,255,255,0.55)";
        ctx.shadowBlur = size * 1.2;
        ctx.arc(cx + p.x * R * 0.94, cy + p.y * R * 0.94, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", layout);
    layout();
    ensure();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
