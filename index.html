<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff85ad">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>گوی نیایش</title>
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url("fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: Vazirmatn;
      src: url("fonts/Vazirmatn-Bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: max(12px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
      font-family: Vazirmatn, Tahoma, sans-serif;
      color: #b83266;
      background: linear-gradient(165deg, #ffe3ec 0%, #e9d5ff 46%, #fff5f8 100%);
    }
    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .sky span {
      position: absolute;
      top: -12vh;
      width: 16px;
      height: 26px;
      border-radius: 70% 20% 70% 20%;
      background: rgba(255, 133, 173, 0.35);
      animation: drift 34s linear infinite;
    }
    .sky span:nth-child(1) { left: 6%; animation-duration: 38s; }
    .sky span:nth-child(2) { left: 24%; animation-duration: 44s; animation-delay: -10s; background: rgba(255, 210, 160, 0.4); }
    .sky span:nth-child(3) { left: 48%; animation-duration: 36s; animation-delay: -18s; }
    .sky span:nth-child(4) { left: 70%; animation-duration: 42s; animation-delay: -6s; }
    .sky span:nth-child(5) { left: 88%; animation-duration: 40s; animation-delay: -22s; }
    .sky i {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0));
      animation: glow 12s ease-in-out infinite;
    }
    .sky i:nth-child(6) { top: 6%; left: 4%; }
    .sky i:nth-child(7) { top: 18%; right: 2%; animation-delay: -4s; }
    @keyframes drift {
      from { transform: translateY(-10vh) rotate(0deg); }
      to { transform: translateY(110vh) rotate(40deg); }
    }
    @keyframes glow {
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    .note, #stage { position: relative; z-index: 1; }
    .note {
      width: min(560px, 100%);
      margin: 0 0 10px;
      padding: 12px 16px 10px;
      text-align: center;
      background: rgba(255, 249, 244, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(184, 50, 102, 0.12);
      backdrop-filter: blur(14px);
    }
    .note p { margin: 0; }
    .note .name {
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 700;
      color: #e84a7f;
      line-height: 1.4;
    }
    .note .more {
      margin-top: 2px;
      font-size: clamp(14px, 3.5vw, 22px);
      font-weight: 400;
      color: #b83266;
      line-height: 1.6;
    }
    #stage {
      width: min(100%, calc((100dvh - 168px) * 819 / 1024));
      aspect-ratio: 819 / 1024;
      filter: drop-shadow(0 18px 36px rgba(184, 50, 102, 0.16));
    }
    #photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      border-radius: 22px;
      user-select: none;
      -webkit-user-drag: none;
    }
    #glass {
      position: absolute;
      left: 7%;
      top: 2.4%;
      width: 86%;
      height: 68.8%;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
    }
    #snow { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <i></i><i></i>
  </div>
  <header class="note">
    <p class="name">نیایش قشنگم</p>
    <p class="more">خیلییییییییییییییییی دوست دارم نفسم</p>
  </header>
  <div id="stage">
    <img id="photo" src="globe.jpg" alt="گوی برفی نیایش" width="819" height="1024">
    <div id="glass">
      <canvas id="snow"></canvas>
    </div>
  </div>
  <audio id="song" src="kalimba.wav" loop autoplay playsinline preload="auto"></audio>
  <script>
    const glass = document.getElementById("glass");
    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d", { alpha: true });
    const song = document.getElementById("song");
    song.volume = 0.72;
    function startSong() {
      const pending = song.play();
      if (pending && pending.catch) pending.catch(function () {});
    }
    startSong();
    window.addEventListener("pointerdown", startSong, true);
    window.addEventListener("touchstart", startSong, true);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) startSong();
    });

    const flakes = [];
    function resize() {
      const r = glass.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
    }
    function born(p, anywhere) {
      p.x = Math.random() * 1.55 - 0.78;
      p.y = anywhere ? (-0.95 + Math.random() * 1.7) : (-1.05 - Math.random() * 0.25);
      p.vy = 0.045 + Math.random() * 0.05;
      p.sway = Math.random() * Math.PI * 2;
      p.swaySpeed = 0.35 + Math.random() * 0.45;
      p.size = 2.2 + Math.random() * 4.2;
      p.a = 0.72 + Math.random() * 0.28;
    }
    function ensure() {
      const n = glass.getBoundingClientRect().width < 520 ? 56 : 84;
      while (flakes.length < n) {
        const p = {};
        born(p, true);
        flakes.push(p);
      }
      flakes.length = n;
    }
    let last = performance.now();
    function draw(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const R = Math.min(w, h) / 2;
      ctx.clearRect(0, 0, w, h);
      for (const p of flakes) {
        p.sway += p.swaySpeed * dt;
        p.y += p.vy * dt;
        p.x += Math.sin(p.sway) * 0.08 * dt;
        if (p.y > 0.86 || Math.hypot(p.x, p.y) > 0.97) born(p, false);
        const px = cx + p.x * R * 0.94;
        const py = cy + p.y * R * 0.94;
        const size = p.size * (R / 220);
        ctx.beginPath();
        ctx.fillStyle = "rgba(255,255,255," + p.a + ")";
        ctx.shadowColor = "rgba(255,255,255,0.95)";
        ctx.shadowBlur = size * 2.4;
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }
    window.addEventListener("resize", function () { resize(); ensure(); });
    resize();
    ensure();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
